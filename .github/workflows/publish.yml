# 发布到 npm —— 走 Trusted Publishing（OIDC），不保存任何长期令牌。
#
# 前置条件（一次性，在 npmjs.com 上配）：
#   包 Settings → Trusted Publishing → GitHub Actions
#     Organization or user : ymh0000123
#     Repository           : dsh-theme-endfield
#     Workflow filename    : publish.yml   ← 只写文件名，不带路径
#     Environment name     : 留空
#   字段区分大小写，每个包只能配一个 trusted publisher。
#
# 于是这里不需要 NPM_TOKEN / secrets.NPM_TOKEN，凭据由 id-token 现换现用，
# 公开仓库的公开包会自动带上 provenance（来源可追溯）。

name: Publish

on:
  # 只有打 tag 才发布；push main 不发，避免每次合并都动 npm。
  push:
    tags: ['v*']
  workflow_dispatch:

# 顶层收紧到只读，发布所需的 id-token 权限只给 publish job。
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    name: 发布到 npm
    # Trusted Publishing 只认 GitHub 托管 runner，不能是自建机器。
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # OIDC 换取 npm 凭据，缺这行必然 403
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0 # 取全历史，便于核对 tag 与提交

      # Node 22 自带的 npm 是 10.x，低于 OIDC 所需的 11.5.1；这里用 24 并再抬一次。
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'

      - name: 确保 npm CLI 支持 Trusted Publishing
        run: |
          npm install -g npm@^11.5.1
          echo "npm $(npm --version) / node $(node --version)"

      # 版本纪律门禁：v1.2.1 那次 tag 与包内 version 就不一致，现有 CI 没挡住。
      - name: 校验 tag 与 package.json 版本一致
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          tag="${GITHUB_REF_NAME#v}"
          ver="$(node -p "require('./package.json').version")"
          echo "tag=$tag package.json=$ver"
          if [ "$tag" != "$ver" ]; then
            echo "::error file=package.json,line=2,title=版本号不一致::tag v$tag 与 package.json 的 $ver 不一致"
            exit 1
          fi

      # 复用仓库已有的清单解析脚本，与 ci.yml 跑同一套，发布前先挡红。
      - name: 跑测试套件
        run: node .github/scripts/run-tests.js test:ci

      - name: 发布
        run: npm publish --access public
